version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: model-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  model-server:
    build: .
    container_name: model-server

    restart: always

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}

    depends_on:
      - mysql

    ports:
      - "8000:8000"

    volumes:
      - ./bucket:/app/bucket

volumes:
  mysql_data: