services:
  mysql:
    image: mysql:8.0
    container_name: model-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  model-server:
    build: .

    container_name: model-server

    restart: always

    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./bucket:/app/bucket


volumes:
  mysql_data: